{% extends "base.html" %}

{% block title %}
Delete {{ product.name }}
{% endblock %}

{% block content %}

<div class="card">

    <h1>
        Delete Product
    </h1>

    <p>
        Are you sure you want to delete
        <strong>{{ product.name }}</strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-actions">

            <button type="submit" class="button button-danger">
                Yes, Delete
            </button>

            <a href="{% url 'product-detail' product.id %}" class="button button-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
