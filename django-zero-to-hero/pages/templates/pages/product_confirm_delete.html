{% extends "base.html" %}

{% block title %}
Delete Product
{% endblock %}

{% block content %}

<h1>Delete Product</h1>

<p>
    Are you sure you want to delete
    <strong>{{ product.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, delete
    </button>

    <a href="{% url 'product-detail' product.id %}">
        Cancel
    </a>
</form>

{% endblock %}
