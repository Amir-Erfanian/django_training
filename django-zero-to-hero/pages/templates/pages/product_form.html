{% extends "base.html" %}

{% block title %}
Create Product
{% endblock %}

{% block content %}

<div class="card">

    <h1>
        Create Product
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="button button-primary">
                Create Product
            </button>

            <a href="{% url 'product-list' %}" class="button button-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
