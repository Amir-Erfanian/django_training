{% extends "base.html" %}

{% block title %}
Update {{ product.name }}
{% endblock %}

{% block content %}

<div class="card">

    <h1>
        Update Product
    </h1>

    <p>
        Editing:
        <strong>{{ product.name }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="button button-primary">
                Save Changes
            </button>

            <a href="{% url 'product-detail' product.id %}" class="button button-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
