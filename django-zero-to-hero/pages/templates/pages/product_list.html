{% extends "base.html" %}

{% block title %}
Products
{% endblock %}

{% block content %}

<h1>Products</h1>

<ul>

{% for product in products %}

    <li>
        <a href="{% url 'product-detail' product.id %}">
            {{ product.name }}
        </a>

        - ${{ product.price }}
    </li>

{% empty %}

    <li>No products found.</li>

{% endfor %}

</ul>

{% endblock %}
