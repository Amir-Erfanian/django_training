{% extends "base.html" %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}

<div class="card">

    <h1>
        {{ product.name }}
    </h1>

    <p class="price">
        ${{ product.price }}
    </p>

    <div class="buttons">

        <a href="{% url 'product-update' product.id %}" class="button button-primary">
            Edit Product
        </a>

        <a href="{% url 'product-delete' product.id %}" class="button button-danger">
            Delete Product
        </a>

        <a href="{% url 'product-list' %}" class="button button-secondary">
            Back to Products
        </a>

    </div>

</div>

{% endblock %}
