<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Django Store
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        nav {
            background: #222;
            padding: 16px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .container {
            width: min(1000px, 90%);
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(250px, 1fr));

            gap: 20px;
            margin-top: 25px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .product-card h3 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .button {
            display: inline-block;
            padding: 9px 15px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button-primary {
            background: #2563eb;
            color: white;
        }

        .button-secondary {
            background: #e5e7eb;
            color: #222;
        }

        .button-danger {
            background: #dc2626;
            color: white;
        }

        .button:hover {
            opacity: 0.85;
        }

        form p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 5px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <nav>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'product-list' %}">
            Products
        </a>

        <a href="{% url 'product-create' %}">
            Add Product
        </a>

        <a href="{% url 'about' %}">
            About
        </a>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
