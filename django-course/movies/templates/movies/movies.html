{% extends 'movies/base.html' %}

{% block title %} Movies {% endblock %}
{% block content %} 
<h1>Movies</h1>

{% for movie in movies_list %}

    <article>
        <h2>{{ movie.title }}</h2>

        <p>Year: {{ movie.year }}</p>

        <p>{{ movie.description }}</p>
    </article>

{% empty %}

    <p>No movies found.</p>

{% endfor %}

{% endblock %}
