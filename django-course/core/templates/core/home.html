{% extends "core/base.html" %}
{% load static %}

{% block title %}
Home
{% endblock %}

{% block content %}

<h1>Welcome to my website, {{ name }}!</h1>
<img src="{% static 'core/images/profile.jpeg' %}" alt="Profile photo">
<p>This is the home page.</p>

<h2>My Skills</h2>

<ul>
    {% for skill in skills %}
        <li>{{ skill }}</li>
    {% endfor %}
</ul>

{% endblock %}
