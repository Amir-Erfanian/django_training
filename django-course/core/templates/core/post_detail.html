{% extends 'core/base.html' %}

{% block title %}
{{ post.title }}
{% endblock %}

{% block content %}
<article>

    <h1>{{ post.title }}</h1>

    <p>{{ post.content }}</p>

    <small>
        Created: {{ post.created_at }}
    </small>

</article>

<a href="{% url 'post_update' post.id %}">
    Edit Post
</a>

<a href="{% url 'post_delete' post.id %}">
    Delete Post
</a>

<a href="{% url 'post_list' %}">
    ← Back to posts
</a>

{% endblock %}
