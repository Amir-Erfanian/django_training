{% extends 'core/base.html' %}

{% block title %}
Delete {{ post.title }}
{% endblock %}

{% block content %}

<h1>Delete Post</h1>

<p>
    Are you sure you want to delete:
    <strong>{{ post.title }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<a href="{% url 'post_detail' post.id %}">
    Cancel
</a>

{% endblock %}
