{% extends 'core/base.html' %}

{% block title %}
Posts
{% endblock %}

{% block content %}

<h1>All Posts</h1>

{% for post in posts %}

    <article>
        <h2>
            <a href="{% url 'post_detail' post.id %}">
                {{ post.title }}
            </a>
        </h2>

        <p>{{ post.content }}</p>

        <p>
            Author: {{ post.author.username }}
        </p>

        <small>
            Created: {{ post.created_at }}
        </small>
    </article>

{% empty %}

    <p>No posts yet.</p>

{% endfor %}

{% endblock %}
