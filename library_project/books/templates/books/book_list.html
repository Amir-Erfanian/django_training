{% extends "base.html" %}

{% block title %}
Books
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Books</h2>

    <a href="{% url 'book-add' %}" class="btn btn-success">
        Add Book
    </a>
</div>

<div class="row">

    {% for book in books %}

    <div class="col-md-4 mb-4">

        <div class="card h-100 shadow-sm">

            <div class="card-body d-flex flex-column">

                <h5 class="card-title">
                    {{ book.title }}
                </h5>

                <p class="card-text mb-1">
                    <strong>Author:</strong>
                    {{ book.author }}
                </p>

                <p class="card-text mb-1">
                    <strong>Pages:</strong>
                    {{ book.pages }}
                </p>

                <p class="card-text mb-3">
                    <strong>Price:</strong>
                    ${{ book.price }}
                </p>

                <div class="mt-auto">

                    <a href="{% url 'book-detail' book.pk %}" class="btn btn-primary btn-sm">
                        Details
                    </a>

                    <a href="{% url 'book-edit' book.pk %}" class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{% url 'book-delete' book.pk %}" class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </div>

            </div>

        </div>

    </div>

    {% empty %}

    <div class="col-12">

        <div class="alert alert-info">
            No books found.
        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
