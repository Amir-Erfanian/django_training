{% extends "base.html" %}

{% block title %}
Book Form
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header">
        <h3>Book Form</h3>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-success">
                Save
            </button>
            <a href="{% url 'book-list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
