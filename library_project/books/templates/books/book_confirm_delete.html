{% extends "base.html" %}

{% block title %}
Delete Book
{% endblock %}

{% block content %}

<div class="alert alert-danger">

    <h3>
        Delete "{{ object }}"?
    </h3>
    <p>
        This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">
            Delete
        </button>
        <a href="{% url 'book-detail' object.pk %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
